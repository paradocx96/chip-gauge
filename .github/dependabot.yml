version: 2
# Monthly + fully grouped so each ecosystem opens at most one PR (one CI run)
# per cycle instead of a PR per package.
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      nuget-all:
        patterns: ["*"]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions-all:
        patterns: ["*"]
    commit-message:
      prefix: ci
