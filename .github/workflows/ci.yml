name: CI

# Cost-conscious triggers: validate pull requests and the post-merge state of
# main only. Feature branches are covered by their PR, so intermediate pushes do
# not each spawn a run. Use "Run workflow" for ad-hoc runs (incl. Windows).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_windows:
        description: "Also run the Windows build/test job"
        type: boolean
        default: false

# Cancel superseded runs on the same ref so we never pay for stale work.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # One Linux runner does everything (format + build + test) — no extra runner
  # spin-ups, one restore. This is the gate for every PR.
  build-test:
    name: Build & test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ChipGauge.slnx

      - name: Verify formatting & style
        run: dotnet format ChipGauge.slnx --no-restore --verify-no-changes --severity warn

      - name: Build (warnings as errors)
        run: dotnet build ChipGauge.slnx -c Release --no-restore

      - name: Test
        run: dotnet test ChipGauge.slnx -c Release --no-build

  # Windows costs 2x Linux minutes and every non-UI, non-provider path is already
  # covered on Linux — so it runs only on demand (dispatch with run_windows=true).
  windows:
    name: Build & test (Windows)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ChipGauge.slnx

      - name: Build (warnings as errors)
        run: dotnet build ChipGauge.slnx -c Release --no-restore

      - name: Test
        run: dotnet test ChipGauge.slnx -c Release --no-build
