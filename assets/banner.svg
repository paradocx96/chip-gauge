<svg width="1280" height="380" viewBox="0 0 1280 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ChipGauge — real-time hardware monitoring">
  <defs>
    <linearGradient id="b-bg" x1="0" y1="0" x2="1280" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#131A33"/>
      <stop offset="1" stop-color="#0A1530"/>
    </linearGradient>
    <linearGradient id="b-tile" x1="96" y1="96" x2="416" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.55" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="b-value" x1="150" y1="320" x2="300" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#F0FDFF"/>
    </linearGradient>
    <linearGradient id="b-word" x1="360" y1="120" x2="1050" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="380" rx="0" fill="url(#b-bg)"/>

  <!-- subtle grid lines -->
  <g stroke="#38BDF8" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 90 H1280 M0 190 H1280 M0 290 H1280"/>
    <path d="M320 0 V380 M640 0 V380 M960 0 V380"/>
  </g>

  <!-- Glyph -->
  <g transform="translate(96,110) scale(0.3125)">
    <g fill="#C7D2FE" opacity="0.85">
      <rect x="150" y="70" width="26" height="34" rx="7"/>
      <rect x="243" y="70" width="26" height="34" rx="7"/>
      <rect x="336" y="70" width="26" height="34" rx="7"/>
      <rect x="150" y="408" width="26" height="34" rx="7"/>
      <rect x="243" y="408" width="26" height="34" rx="7"/>
      <rect x="336" y="408" width="26" height="34" rx="7"/>
      <rect x="70" y="150" width="34" height="26" rx="7"/>
      <rect x="70" y="243" width="34" height="26" rx="7"/>
      <rect x="70" y="336" width="34" height="26" rx="7"/>
      <rect x="408" y="150" width="34" height="26" rx="7"/>
      <rect x="408" y="243" width="34" height="26" rx="7"/>
      <rect x="408" y="336" width="34" height="26" rx="7"/>
    </g>
    <rect x="96" y="96" width="320" height="320" rx="86" fill="url(#b-tile)"/>
    <path d="M 153.8 315 A 118 118 0 1 1 358.2 315" fill="none" stroke="#0B1220" stroke-opacity="0.30" stroke-width="26" stroke-linecap="round"/>
    <path d="M 153.8 315 A 118 118 0 0 1 296.4 145.1" fill="none" stroke="url(#b-value)" stroke-width="26" stroke-linecap="round"/>
    <path d="M 241.1 277.3 L 315.7 170.8" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
    <circle cx="256" cy="256" r="22" fill="#F8FAFC"/>
    <circle cx="256" cy="256" r="9" fill="#4F46E5"/>
  </g>

  <!-- Wordmark + tagline -->
  <text x="360" y="188" font-family="'Segoe UI', 'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="96" font-weight="700" letter-spacing="-3" fill="url(#b-word)">ChipGauge</text>
  <text x="364" y="240" font-family="'Segoe UI', 'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="30" font-weight="400" fill="#94A3B8">Real-time hardware monitoring for your desktop.</text>

  <!-- feature chips -->
  <g font-family="'Segoe UI', 'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="22" font-weight="600">
    <g>
      <rect x="364" y="272" width="118" height="44" rx="22" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="423" y="300" text-anchor="middle" fill="#E2E8F0">CPU</text>
    </g>
    <g>
      <rect x="494" y="272" width="118" height="44" rx="22" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="553" y="300" text-anchor="middle" fill="#E2E8F0">GPU</text>
    </g>
    <g>
      <rect x="624" y="272" width="150" height="44" rx="22" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="699" y="300" text-anchor="middle" fill="#E2E8F0">Sensors</text>
    </g>
    <g>
      <rect x="786" y="272" width="150" height="44" rx="22" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="861" y="300" text-anchor="middle" fill="#E2E8F0">S.M.A.R.T.</text>
    </g>
  </g>
</svg>
