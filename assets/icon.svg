<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ChipGauge">
  <defs>
    <linearGradient id="tile" x1="96" y1="96" x2="416" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.55" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="value" x1="150" y1="320" x2="300" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#F0FDFF"/>
    </linearGradient>
    <linearGradient id="needle" x1="256" y1="256" x2="316" y2="171" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E0F2FE"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B1220" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Chip pin contacts -->
  <g fill="#C7D2FE" opacity="0.9">
    <rect x="150" y="70" width="26" height="34" rx="7"/>
    <rect x="243" y="70" width="26" height="34" rx="7"/>
    <rect x="336" y="70" width="26" height="34" rx="7"/>
    <rect x="150" y="408" width="26" height="34" rx="7"/>
    <rect x="243" y="408" width="26" height="34" rx="7"/>
    <rect x="336" y="408" width="26" height="34" rx="7"/>
    <rect x="70" y="150" width="34" height="26" rx="7"/>
    <rect x="70" y="243" width="34" height="26" rx="7"/>
    <rect x="70" y="336" width="34" height="26" rx="7"/>
    <rect x="408" y="150" width="34" height="26" rx="7"/>
    <rect x="408" y="243" width="34" height="26" rx="7"/>
    <rect x="408" y="336" width="34" height="26" rx="7"/>
  </g>

  <!-- Chip body -->
  <rect x="96" y="96" width="320" height="320" rx="86" fill="url(#tile)" filter="url(#soft)"/>
  <rect x="96" y="96" width="320" height="320" rx="86" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>

  <!-- Gauge track -->
  <path d="M 153.8 315 A 118 118 0 1 1 358.2 315" fill="none" stroke="#0B1220" stroke-opacity="0.28" stroke-width="26" stroke-linecap="round"/>
  <!-- Gauge value -->
  <path d="M 153.8 315 A 118 118 0 0 1 296.4 145.1" fill="none" stroke="url(#value)" stroke-width="26" stroke-linecap="round"/>

  <!-- Needle -->
  <path d="M 241.1 277.3 L 315.7 170.8" stroke="url(#needle)" stroke-width="16" stroke-linecap="round"/>
  <!-- Hub -->
  <circle cx="256" cy="256" r="22" fill="#F8FAFC"/>
  <circle cx="256" cy="256" r="9" fill="#4F46E5"/>
</svg>
